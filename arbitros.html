<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FIFA 2026 - Oficiales Arbitrales</title>

<style>
body{margin:0;font-family:Arial;background:#0f172a;color:white}
header{background:#111827;padding:30px;text-align:center}

.filters{background:#111827;padding:20px;display:flex;justify-content:center;gap:12px;flex-wrap:wrap}
.filters input,.filters select{padding:12px;border:none;border-radius:10px;background:#1e293b;color:white}

#resetBtn{padding:12px;border:none;border-radius:10px;background:#dc2626;color:white;cursor:pointer;font-weight:bold}
#resetBtn:hover{background:#b91c1c}

.container{width:90%;margin:auto;padding:25px;display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px}

.card{background:#1e293b;border-radius:16px;padding:14px;cursor:pointer;border:1px solid rgba(255,255,255,.15);transition:.2s;display:flex;gap:14px;align-items:center}
.card:hover{transform:translateY(-4px);border:1px solid rgba(255,255,255,.35)}

.cardPhoto{width:90px;height:115px;object-fit:cover;border-radius:12px;background:#334155;flex-shrink:0}
.card h3{margin:0 0 6px 0;font-size:17px}
.card p{margin:4px 0;font-size:13px;opacity:.85}

.badge,.roleBadge{display:inline-block;margin-top:6px;padding:4px 8px;border-radius:999px;font-size:11px;font-weight:bold}
.badge.UEFA{background:#1d4ed8}
.badge.CONMEBOL{background:#d4af37;color:#111}
.badge.CONCACAF{background:#38761d}
.badge.CAF{background:#ff0000}
.badge.AFC{background:#ff9900;color:#111}
.badge.OFC{background:#000}

.roleBadge{margin-left:4px;background:#16a34a;color:white}
.roleBadge.VAR{background:#8b5cf6}
.roleBadge.PRINCIPAL{background:#16a34a}

.overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.75);display:none;justify-content:center;align-items:center;z-index:999}

.bigCard{width:420px;max-width:90%;background:white;color:black;border-radius:18px;padding:25px;position:relative;text-align:center}
.bigCard.UEFA{border:4px solid #1d4ed8}
.bigCard.CONMEBOL{border:4px solid #d4af37}
.bigCard.CONCACAF{border:4px solid #38761d}
.bigCard.CAF{border:4px solid #ff0000}
.bigCard.AFC{border:4px solid #ff9900}
.bigCard.OFC{border:4px solid #000}

.modalPhoto{width:180px;height:220px;object-fit:cover;border-radius:14px;margin-bottom:15px;background:#ddd}
.close{position:absolute;top:10px;right:15px;font-size:26px;cursor:pointer}
.conf{font-weight:bold}

@media(max-width:700px){
.container{grid-template-columns:1fr}
}
</style>
</head>

<body>

<header>
<h1>FIFA WORLD CUP 2026™</h1>
<h3>Oficiales Arbitrales FIFA World Cup 2026™</h3>
</header>

<div class="filters">

<input id="search" placeholder="Buscar árbitro..." oninput="applyFilters()">

<select id="confFilter" onchange="applyFilters()">
<option value="ALL">Todas las confederaciones</option>
<option value="UEFA">UEFA</option>
<option value="CONMEBOL">CONMEBOL</option>
<option value="CONCACAF">CONCACAF</option>
<option value="CAF">CAF</option>
<option value="AFC">AFC</option>
<option value="OFC">OFC</option>
</select>

<select id="countryFilter" onchange="applyFilters()">
<option value="ALL">Todos los países</option>
</select>

<select id="typeFilter" onchange="applyFilters()">
<option value="ALL">Todos los roles</option>
<option value="PRINCIPAL">Árbitro Principal</option>
<option value="VAR">VAR</option>
</select>

<button id="resetBtn" onclick="resetFilters()">Eliminar filtros</button>

</div>

<div class="container" id="container"></div>
<div class="overlay" id="overlay"></div>

const container=document.getElementById("container");
const overlay=document.getElementById("overlay");
const countrySelect=document.getElementById("countryFilter");

function loadCountries(){
const countries=[...new Set(referees.map(r=>r[1]))].sort((a,b)=>a.localeCompare(b));
countries.forEach(c=>{
const opt=document.createElement("option");
opt.value=c;
opt.textContent=c;
countrySelect.appendChild(opt);
});
}

function render(list){
container.innerHTML="";

list.forEach(r=>{
const card=document.createElement("div");
card.className="card";

const role=r[6] || "PRINCIPAL";
const roleText=role==="VAR" ? "VAR" : "Árbitro Principal";

card.innerHTML=`
<img class="cardPhoto" src="${r[5]}" alt="${r[0]}">
<div>
<h3>${r[0]}</h3>
<p>${r[1]}</p>
<span class="badge ${r[2]}">${r[2]}</span>
<span class="roleBadge ${role}">${roleText}</span>
</div>
`;

card.onclick=()=>openCard(r);
container.appendChild(card);
});
}

function openCard(r){
const role=r[6] || "PRINCIPAL";
const roleText=role==="VAR" ? "VAR" : "Árbitro Principal";

overlay.innerHTML=`
<div class="bigCard ${r[2]}">
<div class="close" onclick="closeCard()">×</div>
<img class="modalPhoto" src="${r[5]}" alt="${r[0]}">
<h2>${r[0]}</h2>
<p class="conf">${r[2]}</p>
<p><strong>Rol:</strong> ${roleText}</p>
<p><strong>País:</strong> ${r[1]}</p>
<p><strong>Edad:</strong> ${r[3]} años</p>
<p><strong>FIFA desde:</strong> ${r[4]}</p>
</div>
`;

overlay.style.display="flex";
}

function closeCard(){
overlay.style.display="none";
}

function applyFilters(){
const search=document.getElementById("search").value.toLowerCase();
const conf=document.getElementById("confFilter").value;
const country=document.getElementById("countryFilter").value;
const type=document.getElementById("typeFilter").value;

let filtered=referees.filter(r=>{
const role=r[6] || "PRINCIPAL";

const okSearch=r[0].toLowerCase().includes(search);
const okConf=conf==="ALL" || r[2]===conf;
const okCountry=country==="ALL" || r[1]===country;
const okType=type==="ALL" || role===type;

return okSearch && okConf && okCountry && okType;
});

render(filtered);
}

function resetFilters(){
document.getElementById("search").value="";
document.getElementById("confFilter").value="ALL";
document.getElementById("countryFilter").value="ALL";
document.getElementById("typeFilter").value="ALL";

render(referees);
}

overlay.addEventListener("click",function(e){
if(e.target===overlay){
closeCard();
}
});

loadCountries();
render(referees);
</script>
