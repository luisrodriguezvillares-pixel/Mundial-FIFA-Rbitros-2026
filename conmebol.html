<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CONMEBOL - Árbitros</title>

<style>
body{
font-family:Arial;
background:#f4f4f4;
margin:0;
}

header{
background:#d4af37;
color:white;
padding:30px;
text-align:center;
}

.container{
width:90%;
margin:auto;
padding:20px;
}

.card{
background:white;
border-radius:16px;
padding:25px;
margin-bottom:25px;
display:flex;
gap:25px;
align-items:center;
box-shadow:0 2px 8px rgba(0,0,0,.1);
}

.photo{
width:180px;
height:220px;
border-radius:12px;
object-fit:cover;
background:#ddd;
}

.info h2{
margin:0;
}

.conf{
font-weight:bold;
color:#d4af37;
}

@media(max-width:700px){
.card{
flex-direction:column;
text-align:center;
}

.photo{
width:220px;
height:270px;
}
}
</style>
</head>

<body>

<header>
<h1>FIFA WORLD CUP 2026™</h1>
<h3 id="subtitle"></h3>
</header>

<div class="container" id="container"></div>

<script>

const referees = [
["BENITEZ Juan Gabriel","Paraguay",42,2010,"Benitez_Juan_Gabriel.jpeg"],
["CLAUS Raphael","Brasil",45,2015,"Claus_Raphael.jpeg"],
["FALCON PEREZ Yael","Argentina",37,2019,"Falcon_Perez_Yael.jpeg"],
["GARAY Cristian","Chile",35,2019,"Garay_Christian.jpeg"],
["HERRERA Dario","Argentina",40,2015,"Herrera_Dario.jpeg"],
["ORTEGA Kevin","Perú",33,2019,"Ortega_Kevin.jpeg"],
["RAMON ABATTI","Brasil",35,2021,"Abatti_Ramon_Abel.jpeg"],
["ROJAS Andres","Colombia",41,2017,"Rojas_Andres.jpeg"],
["TEJERA Gustavo","Uruguay",37,2018,"Tejera_Gustavo.jpeg"],
["TELLO Facundo","Argentina",43,2019,"Tello_Facundo.jpeg"],
["VALENZUELA Jesus","Venezuela",41,2013,"Valenzuela_Jesus.jpeg"],
["WILTON SAMPAIO","Brasil",43,2013,"Sampaio_Wilton.jpeg"]
];

document.getElementById("subtitle").textContent =
`${referees.length} Árbitros - CONMEBOL`;

const container = document.getElementById("container");

referees.forEach(r=>{

const card=document.createElement("div");
card.className="card";

card.innerHTML=`
<img class="photo" src="${r[4]}" alt="${r[0]}">

<div class="info">
<h2>${r[0]}</h2>
<p class="conf">CONMEBOL</p>
<p><strong>País:</strong> ${r[1]}</p>
<p><strong>Edad:</strong> ${r[2]} años</p>
<p><strong>FIFA desde:</strong> ${r[3]}</p>
</div>
`;

container.appendChild(card);

});

</script>

</body>
</html>
