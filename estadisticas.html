<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Estadísticas Arbitrales FIFA 2026</title>

<style>
body{margin:0;font-family:Arial;background:#0a0f1f;color:white}
header{background:#111b33;padding:16px;text-align:center;font-weight:900}
.box{margin:12px;padding:12px;background:#111b33;border-radius:14px;border:1px solid rgba(255,255,255,.08)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.card{background:#0b1220;border-radius:12px;padding:12px;text-align:center}
.card b{font-size:20px;color:#93c5fd}
.card span{display:block;font-size:11px;opacity:.7;margin-top:4px}
select{width:100%;padding:8px;border-radius:8px;border:none;background:#0b1220;color:white;margin-top:8px}
canvas{margin-top:10px;background:#0b1220;border-radius:12px;padding:10px}
table{width:100%;border-collapse:collapse;font-size:12px;margin-top:10px}
th,td{padding:8px;border-bottom:1px solid rgba(255,255,255,.08);text-align:left}
th{opacity:.7}
@media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}}
</style>
</head>

<body>

<header>📊 ESTADÍSTICAS ARBITRALES · FIFA WORLD CUP 2026</header>

<div class="box">
<label>Filtrar por árbitro</label>
<select id="refFilter">
<option value="all">Todos los árbitros</option>
</select>
</div>

<div class="box">
<div class="grid">
<div class="card"><b id="pj">0</b><span>Partidos evaluados</span></div>
<div class="card"><b id="media">0.0</b><span>Nota media</span></div>
<div class="card"><b id="amarillas">0</b><span>Amarillas totales</span></div>
<div class="card"><b id="rojas">0</b><span>Rojas totales</span></div>
<div class="card"><b id="penaltis">0</b><span>Penaltis correctos</span></div>
<div class="card"><b id="var">0</b><span>Acciones VAR</span></div>
<div class="card"><b id="graves">0</b><span>Errores graves</span></div>
<div class="card"><b id="gestion">0</b><span>Gestión deficiente</span></div>
</div>
</div>

<div class="box">
<h3>Gráfico de acciones arbitrales</h3>
<canvas id="statsChart"></canvas>
</div>

<div class="box">
<h3>Resumen por árbitro</h3>
<table>
<thead>
<tr>
<th>Árbitro</th>
<th>PJ</th>
<th>Media</th>
<th>Amarillas</th>
<th>Rojas</th>
<th>Penaltis</th>
<th>VAR</th>
<th>Graves</th>
</tr>
</thead>
<tbody id="tableBody"></tbody>
</table>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyAVCqC9XrDivMUCwjR-qAz97XHkBkF2Lf4",
  authDomain: "mundial-fifa-arbitros-2026.firebaseapp.com",
  databaseURL: "https://mundial-fifa-arbitros-2026-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "mundial-fifa-arbitros-2026",
  storageBucket: "mundial-fifa-arbitros-2026.firebasestorage.app",
  messagingSenderId: "915513430296",
  appId: "1:915513430296:web:6f3f4400e9b6e3dfb08e6d"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

let allData = {};
let chart;

function finalNota(d){
let auto=10;
auto-=(Number(d.menores)||0)*0.20;
auto-=(Number(d.importantes)||0)*0.70;
auto-=(Number(d.graves)||0)*1.50;
auto-=(Number(d.varError)||0)*0.70;
auto-=(Number(d.gestion)||0)*0.50;
auto-=(Number(d.amarillaMal)||0)*0.30;
auto+=(Number(d.amarillaBien)||0)*0.30;
auto+=(Number(d.rojas)||0)*0.70;
auto-=(Number(d.rojaMal)||0)*1.50;
auto+=(Number(d.penaltis)||0)*0.70;
auto+=(Number(d.buenvar)||0)*0.30;
auto+=(Number(d.ventajas)||0)*0.20;
auto+=(Number(d.control)||0)*0.50;
auto+=(Number(d.addedGood)||0)*0.20;
auto-=(Number(d.addedBad)||0)*0.20;
auto=Math.max(0,Math.min(10,auto));
const personal=Number(d.personal)||0;
return personal ? personal*0.6 + auto*0.4 : auto;
}

function valid(d){
return d && d.referee && (d.notaHTML || d.personal || d.penaltis || d.rojas || d.graves);
}

function updateFilter(data){
const select=document.getElementById("refFilter");
const current=select.value;
const refs=[...new Set(Object.values(data).filter(valid).map(d=>d.referee))].sort();

select.innerHTML='<option value="all">Todos los árbitros</option>' +
refs.map(r=>`<option value="${r}">${r}</option>`).join("");

select.value=refs.includes(current)?current:"all";
}

function render(){
const filter=document.getElementById("refFilter").value;
let rows=Object.values(allData).filter(valid);

if(filter!=="all"){
rows=rows.filter(d=>d.referee===filter);
}

let total={
pj:rows.length,
suma:0,
amarillas:0,
rojas:0,
penaltis:0,
var:0,
graves:0,
gestion:0,
importantes:0,
menores:0
};

rows.forEach(d=>{
total.suma+=finalNota(d);
total.amarillas+=(Number(d.amarillaBien)||0)+(Number(d.amarillaMal)||0);
total.rojas+=(Number(d.rojas)||0)+(Number(d.rojaMal)||0);
total.penaltis+=Number(d.penaltis)||0;
total.var+=(Number(d.buenvar)||0)+(Number(d.varError)||0);
total.graves+=Number(d.graves)||0;
total.gestion+=Number(d.gestion)||0;
total.importantes+=Number(d.importantes)||0;
total.menores+=Number(d.menores)||0;
});

document.getElementById("pj").textContent=total.pj;
document.getElementById("media").textContent=total.pj?(total.suma/total.pj).toFixed(2):"0.0";
document.getElementById("amarillas").textContent=total.amarillas;
document.getElementById("rojas").textContent=total.rojas;
document.getElementById("penaltis").textContent=total.penaltis;
document.getElementById("var").textContent=total.var;
document.getElementById("graves").textContent=total.graves;
document.getElementById("gestion").textContent=total.gestion;

const chartData=[
total.amarillas,
total.rojas,
total.penaltis,
total.var,
total.graves,
total.importantes,
total.menores,
total.gestion
];

if(chart){chart.destroy();}

chart=new Chart(document.getElementById("statsChart"),{
type:"bar",
data:{
labels:["Amarillas","Rojas","Penaltis","VAR","Graves","Importantes","Menores","Gestión"],
datasets:[{
label:"Total",
data:chartData
}]
},
options:{
responsive:true,
plugins:{legend:{display:false}},
scales:{
x:{ticks:{color:"white"},grid:{color:"rgba(255,255,255,.08)"}},
y:{ticks:{color:"white",precision:0},grid:{color:"rgba(255,255,255,.08)"}}
}
}
});

renderTable();
}

function renderTable(){
const refs={};

Object.values(allData).filter(valid).forEach(d=>{
if(!refs[d.referee]){
refs[d.referee]={pj:0,suma:0,amarillas:0,rojas:0,penaltis:0,var:0,graves:0};
}

refs[d.referee].pj++;
refs[d.referee].suma+=finalNota(d);
refs[d.referee].amarillas+=(Number(d.amarillaBien)||0)+(Number(d.amarillaMal)||0);
refs[d.referee].rojas+=(Number(d.rojas)||0)+(Number(d.rojaMal)||0);
refs[d.referee].penaltis+=Number(d.penaltis)||0;
refs[d.referee].var+=(Number(d.buenvar)||0)+(Number(d.varError)||0);
refs[d.referee].graves+=Number(d.graves)||0;
});

const arr=Object.entries(refs).map(([ref,d])=>({
ref,
pj:d.pj,
media:d.suma/d.pj,
amarillas:d.amarillas,
rojas:d.rojas,
penaltis:d.penaltis,
var:d.var,
graves:d.graves
})).sort((a,b)=>b.media-a.media);

document.getElementById("tableBody").innerHTML=arr.length?arr.map(r=>`
<tr>
<td>${r.ref}</td>
<td>${r.pj}</td>
<td>${r.media.toFixed(2)}</td>
<td>${r.amarillas}</td>
<td>${r.rojas}</td>
<td>${r.penaltis}</td>
<td>${r.var}</td>
<td>${r.graves}</td>
</tr>
`).join(""):`<tr><td colspan="8">Todavía no hay estadísticas.</td></tr>`;
}

db.ref("matchCenterData").on("value",snap=>{
allData=snap.val()||{};
updateFilter(allData);
render();
});

document.getElementById("refFilter").addEventListener("change",render);
</script>

</body>
</html>
