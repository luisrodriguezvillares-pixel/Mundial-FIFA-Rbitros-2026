body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#0a0f1f;
  color:white;
}

header{
  background:#111b33;
  padding:14px;
  text-align:center;
  font-weight:800;
}

.topbar{
  display:flex;
  gap:8px;
  padding:10px;
}

#search,#filter{
  flex:1;
  padding:8px;
  border-radius:8px;
  border:none;
  font-size:12px;
}

.container{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
  padding:10px;
}

.match{
  background:#111b33;
  border-radius:14px;
  padding:10px;
  position:relative;
  border:1px solid rgba(255,255,255,.08);
}

.date{
  font-size:11px;
  opacity:.6;
}

.teams{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin:8px 0;
  gap:6px;
}

.team{
  display:flex;
  align-items:center;
  gap:6px;
  font-size:12px;
  font-weight:800;
}

.flag{
  width:20px;
  height:14px;
  border-radius:2px;
}

.hour{
  font-size:12px;
  font-weight:900;
  opacity:.8;
}

.info{
  font-size:10px;
  opacity:.6;
}

.state{
  position:absolute;
  top:8px;
  right:8px;
  font-size:10px;
  padding:3px 6px;
  border-radius:6px;
  background:rgba(255,255,255,.08);
}
.hourBlock{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:1px;
    min-width:55px;
}

.favorite{
    font-size:16px;
    cursor:pointer;
    user-select:none;
    line-height:1;
    margin-bottom:-2px;
}

.hour{
    font-size:12px;
    font-weight:900;
    opacity:.8;
}
.state.live{
  color:#ff3b30;
}

.state.done{
  color:#22c55e;
}

.ref{
  font-size:11px;
  margin-top:6px;
  opacity:.85;
}

select,
input{
  width:100%;
  margin-top:5px;
  padding:5px;
  font-size:10px;
  border-radius:6px;
  border:none;
  background:#0b1220;
  color:white;
}

.btnRow{
  display:flex;
  gap:6px;
  margin-top:6px;
}

.btnHalf{
  flex:1;
  padding:5px;
  font-size:10px;
  border:none;
  border-radius:6px;
  font-weight:700;
  cursor:pointer;
}

.assign{
  background:#22c55e;
}

.remove{
  background:#ef4444;
}

.liveBtn,
.evalBtn,
.deleteEvalBtn{
  width:100%;
  margin-top:6px;
  padding:6px;
  font-size:11px;
  font-weight:800;
  border:none;
  border-radius:8px;
  cursor:pointer;
  color:white;
}

.liveBtn{
  background:#ff3b30;
  display:none;
}

.evalBtn{
  background:#2563eb;
}

.deleteEvalBtn{
  background:#ef4444;
}

.evalPanel{
  display:none;
  margin-top:8px;
  padding:8px;
  border-radius:10px;
  background:#0b1220;
  border:1px solid rgba(255,255,255,.08);
}

.evalGrid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:7px;
}

.evalGrid label{
  font-size:10px;
  opacity:.7;
}

.noteBox{
  margin-top:7px;
  font-size:11px;
  font-weight:800;
  color:#93c5fd;
}
.roundTitle{
  grid-column:1/-1;
  background:#bf9000;
  color:white;
  text-align:center;
  font-weight:900;
  padding:10px;
  border-radius:12px;
  letter-spacing:1px;
  text-transform:uppercase;
}
.roundTitle.octavos{
  background:#f57c00;
  margin-top:20px;
}
.match.featured{
  border:2px solid #ffd700;
  box-shadow:0 0 12px rgba(255,215,0,.35);
}

@media(max-width:800px){
  .container{
    grid-template-columns:1fr;
  }
}
</style>

let saved={};
const container=document.getElementById("matches");

function save(){
  localStorage.setItem("matchCenterData",JSON.stringify(saved));
  db.ref("matchCenterData").set(saved);
}

function loadData(){
  db.ref("matchCenterData").on("value", snapshot=>{
    saved=snapshot.val()||{};
    localStorage.setItem("matchCenterData",JSON.stringify(saved));
    render();
  }, error=>{
    saved=JSON.parse(localStorage.getItem("matchCenterData")||"{}");
    render();
  });
}

    const title=document.createElement("div");
    title.className="roundTitle";
    title.style.background="#025e30";
    title.textContent="SEMIFINALES";
    container.appendChild(title);
    titleSemiAdded=true;
}

if(m[4]==="FINAL" && !titleFinalAdded){
    const title=document.createElement("div");
    title.className="roundTitle";
    title.style.background="linear-gradient(90deg,#003b8e,#d4af37)";
    title.textContent="FINAL";
    container.appendChild(title);
    titleFinalAdded=true;
}
const data=saved[i]||{};
const state=data.state||m[6];
const card=document.createElement("div");
card.className = data.featured ? "match featured" : "match";

card.innerHTML=`
<div class="state ${state==="live"?"live":state==="done"?"done":""}" id="state-${i}">
${state==="live"?"EN DIRECTO":state==="done"?"Finalizado":"No iniciado"}
</div>

<div class="date">${m[0]}</div>

<div class="teams">
  <div class="team">
    <img class="flag" src="https://flagcdn.com/w20/${flag(m[1])}.png">${m[1]}
  </div>

  <div class="hourBlock">
    <div class="favorite"
         onclick="toggleFeatured(${i})"
         title="Favorito">
         ${data.featured ? "⭐" : "☆"}
    </div>
    <div class="hour">${m[2]}</div>
</div>

  <div class="team">
    <img class="flag" src="https://flagcdn.com/w20/${flag(m[3])}.png">${m[3]}
  </div>
</div>

<div class="info">Grupo ${m[4]} · ${m[5]}</div>
<div class="ref" id="ref-${i}">Árbitro: ${data.referee||"Sin asignar"}</div>
<div class="ref" id="varref-${i}">VAR: ${data.varReferee||"Sin asignar"}</div>

<input
  id="refsel-${i}"
  list="referees-list"
  placeholder="Buscar o seleccionar árbitro"
  value="${data.referee || ""}"
>

<datalist id="referees-list">
  ${referees.map(r => `<option value="${r}">`).join("")}
</datalist>
<input
  id="varsel-${i}"
  list="var-list"
  placeholder="Buscar o seleccionar VAR"
  value="${data.varReferee || ""}"
>

<datalist id="var-list">
  ${varOfficials.map(v => `<option value="${v}">`).join("")}
</datalist>
<select id="statesel-${i}">
<option value="not" ${state==="not"?"selected":""}>No iniciado</option>
<option value="live" ${state==="live"?"selected":""}>En directo</option>
<option value="done" ${state==="done"?"selected":""}>Finalizado</option>
</select>

<div class="btnRow">
<button class="btnHalf assign" onclick="apply(${i})">Asignar</button>
<button class="btnHalf remove" onclick="clearRef(${i})">Eliminar</button>
</div>

<button class="liveBtn" id="live-${i}" style="display:${state==="live"?"block":"none"}" onclick="openMatch()">📺 Ver en directo</button>
<button class="evalBtn" onclick="toggleEval(${i})">Valorar partido</button>

<div class="evalPanel" id="eval-${i}">
<div class="evalGrid">
<div><label>Mi valoración</label><input id="personal-${i}" type="number" step="0.1" min="0" max="10" value="${data.personal||""}"></div>
<div><label>Revisiones VAR</label><input id="varReviews-${i}" type="number" min="0" value="${data.varReviews||0}"></div>
<div><label>Error menor</label><input id="menores-${i}" type="number" min="0" value="${data.menores||0}"></div>
<div><label>Error importante</label><input id="importantes-${i}" type="number" min="0" value="${data.importantes||0}"></div>
<div><label>Error grave</label><input id="graves-${i}" type="number" min="0" value="${data.graves||0}"></div>
<div><label>Error del VAR</label><input id="var-${i}" type="number" min="0" value="${data.varError||0}"></div>
<div><label>Gestión deficiente</label><input id="gestion-${i}" type="number" min="0" value="${data.gestion||0}"></div>
<div><label>Amarilla mal</label><input id="amarillaMal-${i}" type="number" min="0" value="${data.amarillaMal||0}"></div>
<div><label>Amarilla bien</label><input id="amarillaBien-${i}" type="number" min="0" value="${data.amarillaBien||0}"></div>
<div><label>Roja correcta</label><input id="rojas-${i}" type="number" min="0" value="${data.rojas||0}"></div>
<div><label>Roja mal sacada</label><input id="rojaMal-${i}" type="number" min="0" value="${data.rojaMal||0}"></div>
<div><label>Penalti correcto</label><input id="penaltis-${i}" type="number" min="0" value="${data.penaltis||0}"></div>
<div><label>VAR corrige bien</label><input id="varGood-${i}" type="number" min="0" value="${data.varGood||0}"></div>
<div><label>Ventaja excelente</label><input id="ventajas-${i}" type="number" min="0" value="${data.ventajas||0}"></div>
<div><label>Control excelente</label><input id="control-${i}" type="number" min="0" value="${data.control||0}"></div>
<div><label>Añadido correcto</label><input id="addedGood-${i}" type="number" min="0" value="${data.addedGood||0}"></div>
<div><label>Añadido incorrecto</label><input id="addedBad-${i}" type="number" min="0" value="${data.addedBad||0}"></div>
</div>

<button class="evalBtn" onclick="calcularNota(${i})">Calcular nota</button>

<button class="deleteEvalBtn" onclick="eliminarValoracion(${i})">Eliminar valoración</button>

<div class="noteBox" id="nota-${i}">${data.notaHTML||"Sin valoración"}</div>
`;

container.appendChild(card);
});
applyFilters();
}

function apply(i){
  const ref = document.getElementById("refsel-"+i).value;
  const varRef = document.getElementById("varsel-"+i).value;
  const state = document.getElementById("statesel-"+i).value;

  saved[i] = saved[i] || {};
  saved[i].referee = ref;
  saved[i].varReferee = varRef;
  saved[i].state = state;
  save();

  document.getElementById("ref-"+i).textContent =
    "Árbitro: " + (saved[i].referee || "Sin asignar");

  document.getElementById("varref-"+i).textContent =
    "VAR: " + (saved[i].varReferee || "Sin asignar");

  const st = document.getElementById("state-"+i);
  const live = document.getElementById("live-"+i);

  st.className = "state";

  if(state==="not"){
    st.textContent="No iniciado";
    live.style.display="none";
  }
  if(state==="live"){
    st.textContent="EN DIRECTO";
    st.classList.add("live");
    live.style.display="block";
  }
  if(state==="done"){
    st.textContent="Finalizado";
    st.classList.add("done");
    live.style.display="none";
  }

  applyFilters();
}

function clearRef(i){
saved[i]=saved[i]||{};
saved[i].referee="";
saved[i].varReferee="";
saved[i].state="not";
save();

document.getElementById("ref-"+i).textContent="Árbitro: Sin asignar";
document.getElementById("varref-"+i).textContent="VAR: Sin asignar";
document.getElementById("statesel-"+i).value="not";
document.getElementById("state-"+i).className="state";
document.getElementById("state-"+i).textContent="No iniciado";
document.getElementById("live-"+i).style.display="none";
applyFilters();
}
function toggleFeatured(i){
  saved[i]=saved[i]||{};
  saved[i].featured=!saved[i].featured;
  save();
  render();
}
function openMatch(){
window.open("https://www.fifa.com/es/tournaments/mens/worldcup/canadamexicousa2026/scores-fixtures","_blank");
}

function toggleEval(i){
const panel=document.getElementById("eval-"+i);
panel.style.display=panel.style.display==="block"?"none":"block";
}

function calcularNota(i){
const personal=Number(document.getElementById("personal-"+i).value)||0;
const varReviews=Number(document.getElementById("varReviews-"+i).value)||0;
const menores=Number(document.getElementById("menores-"+i).value)||0;
const importantes=Number(document.getElementById("importantes-"+i).value)||0;
const graves=Number(document.getElementById("graves-"+i).value)||0;
const varError=Number(document.getElementById("var-"+i).value)||0;
const gestion=Number(document.getElementById("gestion-"+i).value)||0;
const amarillaMal=Number(document.getElementById("amarillaMal-"+i).value)||0;
const amarillaBien=Number(document.getElementById("amarillaBien-"+i).value)||0;
const rojas=Number(document.getElementById("rojas-"+i).value)||0;
const rojaMal=Number(document.getElementById("rojaMal-"+i).value)||0;
const penaltis=Number(document.getElementById("penaltis-"+i).value)||0;
const varGood=Number(document.getElementById("varGood-"+i).value)||0;
const ventajas=Number(document.getElementById("ventajas-"+i).value)||0;
const control=Number(document.getElementById("control-"+i).value)||0;
const addedGood=Number(document.getElementById("addedGood-"+i).value)||0;
const addedBad=Number(document.getElementById("addedBad-"+i).value)||0;

let auto=10;
auto-=menores*0.20;
auto-=importantes*0.70;
auto-=graves*1.50;
// El error VAR no resta al árbitro principal
auto-=gestion*0.50;
auto-=amarillaMal*0.30;
auto+=amarillaBien*0.30;
auto+=rojas*0.70;
auto-=rojaMal*1.50;
auto+=penaltis*0.70;
// El buen VAR no suma al árbitro principal
auto+=ventajas*0.20;
auto+=control*0.50;
auto+=addedGood*0.20;
auto-=addedBad*0.20;

auto=Math.max(0,Math.min(10,auto));

const final=personal ? (personal*0.65 + auto*0.35) : auto;

const notaHTML=
"Automática: "+auto.toFixed(1)+
"<br>Mi valoración: "+(personal ? personal.toFixed(1) : "No puesta")+
"<br>Final: "+final.toFixed(1)+
"<br>Revisiones VAR: "+varReviews;

document.getElementById("nota-"+i).innerHTML=notaHTML;

saved[i]=saved[i]||{};
Object.assign(saved[i],{
personal,varReviews,menores,importantes,graves,varError,gestion,
amarillaMal,amarillaBien,rojas,rojaMal,penaltis,varGood,
ventajas,control,addedGood,addedBad,auto,final,notaHTML
});
save();
}

function eliminarValoracion(i){
  saved[i] = saved[i] || {};

  delete saved[i].personal;
  delete saved[i].varReviews;
  delete saved[i].menores;
  delete saved[i].importantes;
  delete saved[i].graves;
  delete saved[i].varError;
  delete saved[i].gestion;
  delete saved[i].amarillaMal;
  delete saved[i].amarillaBien;
  delete saved[i].rojas;
  delete saved[i].rojaMal;
  delete saved[i].penaltis;
  delete saved[i].buenvar;
  delete saved[i].varGood;
  delete saved[i].ventajas;
  delete saved[i].control;
  delete saved[i].addedGood;
  delete saved[i].addedBad;
  delete saved[i].auto;
  delete saved[i].final;
  delete saved[i].notaHTML;

  save();
  render();
}

function applyFilters(){
const search=document.getElementById("search").value.toLowerCase();
const filter=document.getElementById("filter").value;

document.querySelectorAll(".match").forEach((card,i)=>{
const state=(saved[i]&&saved[i].state)||matches[i][6];
const group=matches[i][4];
const text=matches[i].join(" ").toLowerCase();

let visible=text.includes(search);

if(filter!=="all"){
  if(["not","live","done"].includes(filter)){
    visible=visible && state===filter;
  }else if(filter==="fav"){
    visible=visible && saved[i] && saved[i].featured;
  }else{
    visible=visible && group===filter;
  }
}

card.style.display=visible?"block":"none";
});

document.querySelectorAll(".roundTitle").forEach(title=>{
  const texto=title.textContent;

  let ronda="";
 if(texto.includes("16AVOS")) ronda="16avos";
if(texto.includes("OCTAVOS")) ronda="octavos";
if(texto.includes("CUARTOS")) ronda="Cuartos";
if(texto.includes("SEMIFINALES")) ronda="Semis";
if(texto.includes("FINAL")) ronda="FINAL";

  const visible=[...document.querySelectorAll(".match")]
    .filter(card=>card.style.display!=="none")
    .some(card=>card.querySelector(".info")?.textContent.includes(ronda));

  title.style.display=visible?"block":"none";
});
}

document.getElementById("search").addEventListener("input",applyFilters);
document.getElementById("filter").addEventListener("change",applyFilters);

loadData();
</script>

</body>
</html>
