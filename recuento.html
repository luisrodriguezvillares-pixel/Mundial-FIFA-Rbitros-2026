function matchName(i){
  if(!matches[i]){
    return "Partido " + (Number(i)+1) + " del Match Center";
  }

  return matches[i][1] + " - " + matches[i][3];
}

function contar(data, campo, listaCompleta){
  const resumen = {};

  listaCompleta.forEach(nombre=>{
    resumen[nombre] = {
      nombre:nombre,
      total:0,
      partidos:[]
    };
  });

  Object.keys(data || {}).forEach(i=>{
    const item = data[i];

    if(!item || !item[campo]) return;

    const nombre = item[campo];

    if(!resumen[nombre]){
      resumen[nombre] = {
        nombre:nombre,
        total:0,
        partidos:[]
      };
    }

    resumen[nombre].total++;
    resumen[nombre].partidos.push(matchName(i));
  });

  return Object.values(resumen).sort((a,b)=>{
    if(b.total !== a.total){
      return b.total - a.total;
    }

    return a.nombre.localeCompare(b.nombre);
  });
}

    resumen[nombre].total++;
    resumen[nombre].partidos.push(matchName(i));
  });

  return Object.values(resumen).sort((a,b)=>b.total-a.total || a.nombre.localeCompare(b.nombre));
}

function renderTable(id, emptyId, datos){
  const tbody = document.getElementById(id);
  const empty = document.getElementById(emptyId);

  tbody.innerHTML = "";

  if(datos.length===0){
    empty.textContent = "Todavía no hay datos guardados.";
    return;
  }

  empty.textContent = "";

  datos.forEach((item,index)=>{
    const tr = document.createElement("tr");

    tr.innerHTML = `
      <td>${index+1}</td>
      <td><strong>${item.nombre}</strong></td>
      <td class="number"><span class="badge">${item.total}</span></td>
      <td>${item.partidos.join("<br>")}</td>
    `;

    tbody.appendChild(tr);
  });
}

function cargarRecuentoLocal(){
  const data = JSON.parse(
    localStorage.getItem("matchCenterData") || "{}"
  );

 const principales = contar(data, "referee", referees);
const vars = contar(data, "varReferee", varOfficials);

  renderTable("principalTable","principalEmpty",principales);
  renderTable("varTable","varEmpty",vars);
}

function loadData(){
  db.ref("matchCenterData").on(
    "value",
    snapshot=>{
      const data = snapshot.val();

      if(data){
        const principales = contar(data, "referee", referees);
        const vars = contar(data, "varReferee", varOfficials);

        renderTable("principalTable","principalEmpty",principales);
        renderTable("varTable","varEmpty",vars);
      }else{
        cargarRecuentoLocal();
      }
    },
    error=>{
      console.error("Error de Firebase:", error);
      cargarRecuentoLocal();

      const principalEmpty = document.getElementById("principalEmpty");
      const varEmpty = document.getElementById("varEmpty");

      if(principalEmpty && principalEmpty.textContent===""){
        principalEmpty.textContent="No se han podido leer los datos de Firebase.";
      }

      if(varEmpty && varEmpty.textContent===""){
        varEmpty.textContent="No se han podido leer los datos de Firebase.";
      }
    }
  );
}

function showTab(tab){
  const principal = document.getElementById("principalSection");
  const varSec = document.getElementById("varSection");
  const buttons = document.querySelectorAll(".tab");

  buttons.forEach(b=>b.classList.remove("active"));

  if(tab==="principal"){
    principal.style.display="block";
    varSec.style.display="none";
    buttons[0].classList.add("active");
  }else{
    principal.style.display="none";
    varSec.style.display="block";
    buttons[1].classList.add("active");
  }
}
