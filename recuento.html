function matchName(i){
  if(!matches[i]){
    return "Partido " + (Number(i)+1) + " del Match Center";
  }

  return matches[i][1] + " - " + matches[i][3];
}

function contar(data, campo){
  const resumen = {};

  Object.keys(data).forEach(i=>{
    const item = data[i];
    if(!item || !item[campo]) return;

    const nombre = item[campo];

    if(!resumen[nombre]){
      resumen[nombre] = {
        nombre:nombre,
        total:0,
        partidos:[]
      };
    }

    resumen[nombre].total++;
    resumen[nombre].partidos.push(matchName(i));
  });

  return Object.values(resumen).sort((a,b)=>b.total-a.total || a.nombre.localeCompare(b.nombre));
}

function renderTable(id, emptyId, datos){
  const tbody = document.getElementById(id);
  const empty = document.getElementById(emptyId);

  tbody.innerHTML = "";

  if(datos.length===0){
    empty.textContent = "Todavía no hay datos guardados.";
    return;
  }

  empty.textContent = "";

  datos.forEach((item,index)=>{
    const tr = document.createElement("tr");

    tr.innerHTML = `
      <td>${index+1}</td>
      <td><strong>${item.nombre}</strong></td>
      <td class="number"><span class="badge">${item.total}</span></td>
      <td>${item.partidos.join("<br>")}</td>
    `;

    tbody.appendChild(tr);
  });
}

function loadData(){
  db.ref("matchCenterData").on("value", snapshot=>{
    const data = snapshot.val() || {};

    const principales = contar(data, "referee");
    const vars = contar(data, "varReferee");

    renderTable("principalTable","principalEmpty",principales);
    renderTable("varTable","varEmpty",vars);
  });
}

function showTab(tab){
  const principal = document.getElementById("principalSection");
  const varSec = document.getElementById("varSection");
  const buttons = document.querySelectorAll(".tab");

  buttons.forEach(b=>b.classList.remove("active"));

  if(tab==="principal"){
    principal.style.display="block";
    varSec.style.display="none";
    buttons[0].classList.add("active");
  }else{
    principal.style.display="none";
    varSec.style.display="block";
    buttons[1].classList.add("active");
  }
}
